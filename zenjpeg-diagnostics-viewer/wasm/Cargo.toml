[package]
name = "zenjpeg-diagnostics-wasm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
repository = "https://github.com/imazen/zenjpeg"
description = "WASM bindings for the unstable zenjpeg encode-diagnostics demo viewer."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zenjpeg = { path = "../../zenjpeg", default-features = false, features = ["__diagnostics"] }
fast-ssim2 = { version = "0.8.0", default-features = false }
zensim = { version = "0.2.7", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
enough = { version = "0.4", features = ["std"] }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

[workspace]

# Match the paired pre-release dependencies used by the parent workspace.
[patch.crates-io]
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "f23ac7535be1144a22d0dc6b71f866a08b151f34" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "ec07e8d5639d82703ec6fe6c735e187a55df4eb2" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "ec07e8d5639d82703ec6fe6c735e187a55df4eb2" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "7e9d296c9e037e626234c9f0e8673d48278f83f0" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
