[package]
name = "zenjpeg-diagnostics-wasm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
repository = "https://github.com/imazen/zenjpeg"
description = "WASM bindings for the unstable zenjpeg encode-diagnostics demo viewer."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zenjpeg = { path = "../../zenjpeg", default-features = false, features = ["__diagnostics"] }
butteraugli = { version = "0.9.3", default-features = false }
fast-ssim2 = { version = "0.8.0", default-features = false }
zensim = { version = "0.2.7", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
enough = { version = "0.4", features = ["std"] }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

[workspace]

# Exact reviewed main cohort; dependency patch tables do not propagate.
# Keep the diagnostics metric at its published0.2.7 source/profile semantics.
[patch.crates-io]
# Canonical-plane cohort used by the isolated sans-I/O qualification.
garb = { git = "https://github.com/imazen/garb", rev = "8f9aa10d09f84bb0a1e3fdbd1773f610eec1b784" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "2969ee846e92a4f00f34ab447edaf1eb6857ebe0" }
# Published zenresize 0.3.1 requires zenpixels 0.2; this existing git source admits 0.3.
zenresize = { git = "https://github.com/imazen/zenresize", rev = "5c5fe0d53b8264a162bc1eba08d2cd4ea2094f4b" }
# PNG strip compression requires this tested source; dependency patches do not propagate.
zenflate = { git = "https://github.com/imazen/zenflate", rev = "a2c7d540fc8f044f7c75398f1c49775560021862" }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "d32e82e529e27433b89de3697ae69d0b62fa8c22" }

# Unpublished ICC recognition fix for the existing Ultra HDR corpus profile.
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "fde59b96632557592cffa9b7301acd8db96ed078" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "fde59b96632557592cffa9b7301acd8db96ed078" }
# The zencodec 0.2 family, all from one optional-control revision.
# zencodec-io, zencodec-coroutine and zenmeta are not on crates.io: these
# patches resolve them for local builds; releases stay gated on publishing them.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "1fb997bb88e7405e6a315bf1f0b22f71e99be272" }
zencodec-io = { git = "https://github.com/imazen/zencodec", rev = "1fb997bb88e7405e6a315bf1f0b22f71e99be272" }
zencodec-coroutine = { git = "https://github.com/imazen/zencodec", rev = "1fb997bb88e7405e6a315bf1f0b22f71e99be272" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "1fb997bb88e7405e6a315bf1f0b22f71e99be272" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "1fb997bb88e7405e6a315bf1f0b22f71e99be272" }
# Native PNG tests and metric dev-dependencies share the same core family.
# Their formerly separate 0.1 core fails with the paired pixel representation.
# zenjpeg depends on ultrahdr-core unconditionally (container/MPF types), and
# crates.io ultrahdr-core 0.6.0 requires zencodec ^0.1: every feature set would
# resolve a second zencodec, and with `ultrahdr` the two GainMapParams collide
# (E0308). This review revision of imazen/ultrahdr (branch
# review/zencodec-0.2-family) takes the family through version edges too.
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "5a3b158c35cdabc5e9de1ef4fb79e0242c99b815" }

# Exact-source SIMD admission candidates; only manifest ranges changed.
# Temporary <=beta.2 caps exclude stable 0.9.31; replace after qualification.
zenblend = { git = "https://github.com/imazen/zenblend", rev = "d477b29c4ffbbcf8bb5f20070b44dac2caf6cf26" }
zentone = { git = "https://github.com/imazen/zentone", rev = "2598054c140bad5cdbe66205dacedc49150dea3d" }
fast-ssim2 = { git = "https://github.com/imazen/fast-ssim2", rev = "0fac45a5f22aae1968b40b1f92d30fe5d97b5f6d" }
butteraugli = { git = "https://github.com/imazen/butteraugli", rev = "948840350f408059d75ead8d0225048cecf4063e" }
# The existing legacy HDR oracle uses core0.4.1, kept on its own source graph.
ultrahdr-core-legacy = { package = "ultrahdr-core", git = "https://github.com/imazen/ultrahdr", rev = "7516b501aedb88f42e6992c7eac7d60032ab6568" }

zensim = { git = "https://github.com/imazen/zensimx", rev = "4255242af5e84cde7099fd5bc8b4bee47df93dd8" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
