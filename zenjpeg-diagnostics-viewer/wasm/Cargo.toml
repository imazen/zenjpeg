[package]
name = "zenjpeg-diagnostics-wasm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
repository = "https://github.com/imazen/zenjpeg"
description = "WASM bindings for the unstable zenjpeg encode-diagnostics demo viewer."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zenjpeg = { path = "../../zenjpeg", default-features = false, features = ["__diagnostics"] }
butteraugli = { version = "0.9.3", default-features = false }
fast-ssim2 = { version = "0.8.0", default-features = false }
zensim = { version = "0.2.7", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
enough = { version = "0.4", features = ["std"] }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

[workspace]

# Match the current main source pins in the parent and fuzz workspaces.
[patch.crates-io]
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "9686936bfa49df370a1e71666b252b9f48f744b4" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "3a10011b6b05d2269e29db5e40db71888d0fcfce" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "3a10011b6b05d2269e29db5e40db71888d0fcfce" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "590afee17f115bc8f0bd26de3dd452efaf85f796" }

garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "9686936bfa49df370a1e71666b252b9f48f744b4" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
