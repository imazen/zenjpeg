[workspace]
resolver = "2"
members = [
    "jpegli",
    "internal/butteraugli",
    "internal/jpegli-internals-sys",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/libjxl/libjxl"
description = "Rust port of jpegli - improved JPEG encoder/decoder"

[workspace.dependencies]
# Core
wide = "0.7"
bytemuck = { version = "1.14", features = ["derive"] }
arrayref = "0.3"
rgb = "0.8"
imgref = "1.10"

# Serialization (for test data)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Color management
lcms2 = "6.0"
moxcms = "0.6"

# Image I/O (for testing)
png = "0.17"
zune-jpeg = "0.4"      # Reference decoder for comparison
mozjpeg = "0.10"       # For encoder comparison
jpeg-decoder = "0.3"   # Another reference decoder

# Quality metrics
dssim = "3.2"
ssimulacra2 = "0.5"

# Testing
approx = "0.5"
proptest = "1.4"
criterion = "0.5"
test-case = "3.3"
codec-eval = { path = "/home/lilith/work/codec-eval" }

# FFI
libc = "0.2"
libloading = "0.8"

# Local crates
butteraugli-oxide = { path = "internal/butteraugli" }

# SIMD dispatch
multiversion = "0.7"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
