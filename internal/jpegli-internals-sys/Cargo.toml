[package]
name = "jpegli-internals-sys"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "FFI bindings to instrumented jpegli C++ internals for parity testing"
links = "jpegli_internals_ffi"
build = "build.rs"
publish = false  # Internal testing only - requires C++ build

[features]
default = []
butteraugli = []

[dependencies]
libc = "0.2"

[build-dependencies]
cmake = "0.1"

[package.metadata.docs.rs]
# Don't build docs.rs - requires C++ submodule
all-features = false
