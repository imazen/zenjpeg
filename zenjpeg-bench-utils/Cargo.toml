[package]
name = "zenjpeg-bench-utils"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
repository = "https://github.com/imazen/zenjpeg"
description = "Benchmarking and comparison utilities for zenjpeg"
keywords = ["jpeg", "benchmark", "testing"]
categories = ["development-tools::testing"]
publish = false  # Internal development crate

[dependencies]
# Cancellation support
enough = { workspace = true }

# Image buffer types
rgb = { workspace = true }
imgref = { workspace = true }

# Image I/O
png = { workspace = true }
# zenpng = { workspace = true }  # Temporarily disabled: zencodec/zenpixels API mismatch

# JPEG decoding (de-facto standard decoder for comparisons)
zune-jpeg = { workspace = true }

# Color management
moxcms = { workspace = true , path = "../../../moxcms" }

# Quality metrics
dssim-core = { workspace = true }
fast-ssim2 = { workspace = true , path = "../../fast-ssim2/fast-ssim2" }
butteraugli = { workspace = true }

# For test image discovery and encoding (decoder required for comparison utilities)
# moxcms enables ICC profile support for XYB JPEG decoding
zenjpeg = { path = "../zenjpeg", default-features = false, features = ["__test-utils", "decoder", "moxcms"] }

# C++ jpegli FFI bindings (optional)
jpegli-internals-sys = { path = "../internal/jpegli-internals-sys", optional = true }
libc = { workspace = true, optional = true }

[features]
default = []
# Enable C++ jpegli encoding via FFI (uses jpegli_* symbols directly)
cjpegli-ffi = ["dep:jpegli-internals-sys", "dep:libc"]

[lints]
workspace = true
