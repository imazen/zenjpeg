[package]
name = "jpegli-bench-utils"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/imazen/jpegli-rs"
description = "Benchmarking and comparison utilities for jpegli-rs"
keywords = ["jpeg", "benchmark", "testing"]
categories = ["development-tools::testing"]
publish = false  # Internal development crate

[dependencies]
# Cancellation support
enough = { workspace = true }

# Image buffer types
rgb = { workspace = true }
imgref = { workspace = true }

# Image I/O
png = { workspace = true }

# JPEG decoding (de-facto standard decoder for comparisons)
zune-jpeg = { workspace = true }

# Color management
moxcms = { workspace = true }

# Quality metrics
dssim = { workspace = true }
fast-ssim2 = { workspace = true }
butteraugli = { workspace = true }

# For test image discovery and encoding
jpegli-rs = { path = "../jpegli-rs", default-features = false, features = ["test-utils"] }

# C++ jpegli FFI bindings (optional)
jpegli-internals-sys = { path = "../internal/jpegli-internals-sys", optional = true }
libc = { workspace = true, optional = true }

[features]
default = []
experimental-hybrid-trellis = ["jpegli-rs/experimental-hybrid-trellis"]
# Enable C++ jpegli encoding via libjpeg-compatible FFI
# NOTE: Requires building jpegli with libjpeg_wrapper.cc (not built by default)
# The wrapper provides jpeg_* symbols that map to jpegli_* functions.
cjpegli-ffi = ["dep:jpegli-internals-sys", "dep:libc"]

[lints]
workspace = true
