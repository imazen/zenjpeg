[package]
name = "zenjpeg-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
rgb = "0.8.53"
imgref = "1.12.3"
zencodec = { version = ">=0.2.0, <0.3.0" }
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
enough = "0.4.3"
zune-jpeg = "0.5"
zune-core = "0.5"

zenpixels = { version = ">=0.3.1, <0.4.0", default-features = false }

[dependencies.zenjpeg]
path = ".."
features = ["zencodec", "inventory", "extended-metadata", "metadata-rewrite"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

# This standalone workspace repeats the root's zencodec 0.2 family patches.
[patch.crates-io]
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "f23ac7535be1144a22d0dc6b71f866a08b151f34" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "f23ac7535be1144a22d0dc6b71f866a08b151f34" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "61fb96f1c8c89d4c8d2210eed8679372d66f8aa7" }
zencodec-io = { git = "https://github.com/imazen/zencodec", rev = "61fb96f1c8c89d4c8d2210eed8679372d66f8aa7" }
zencodec-coroutine = { git = "https://github.com/imazen/zencodec", rev = "61fb96f1c8c89d4c8d2210eed8679372d66f8aa7" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "61fb96f1c8c89d4c8d2210eed8679372d66f8aa7" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "61fb96f1c8c89d4c8d2210eed8679372d66f8aa7" }
# zenjpeg depends on ultrahdr-core unconditionally, and crates.io ultrahdr-core
# 0.6.0 requires zencodec ^0.1 (a second zencodec); use the review revision,
# which takes the family through version edges.
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "7e9d296c9e037e626234c9f0e8673d48278f83f0" }

