[package]
name = "zenjpeg-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
enough = "0.4.3"
zune-jpeg = "0.5"
zune-core = "0.5"

zenpixels = { version = "0.2.10", default-features = false }

[dependencies.zenjpeg]
path = ".."
features = ["zencodec"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

