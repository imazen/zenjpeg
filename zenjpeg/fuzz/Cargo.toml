[package]
name = "zenjpeg-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
rgb = "0.8.53"
imgref = "1.12.3"
zencodec = { git = "https://github.com/imazen/zencodec", rev = "f5a7fd46231048a7290f11df5b32e010a3e529a8" }
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
enough = "0.4.3"
zune-jpeg = "0.5"
zune-core = "0.5"

zenpixels = { version = ">=0.2.10, <0.4.0", default-features = false }

[dependencies.zenjpeg]
path = ".."
features = ["zencodec", "inventory", "extended-metadata", "metadata-rewrite"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

# This standalone workspace repeats the shared codec interface override.
[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", rev = "f5a7fd46231048a7290f11df5b32e010a3e529a8" }
# zenjpeg's default features include `ultrahdr`; crates.io ultrahdr-core 0.6.0
# requires zencodec ^0.1, so use the review revision on the same family pin.
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "6aa34974fdbb80f2b9a59fa9c8f8110ce47af0a8" }

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

