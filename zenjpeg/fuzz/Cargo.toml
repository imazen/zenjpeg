[package]
name = "zenjpeg-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
rgb = "0.8.53"
imgref = "1.12.3"
zencodec = { git = "https://github.com/imazen/zencodec", rev = "d327434b0826a3e39633665c76f5081c0ceb34cc" }
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
enough = "0.4.3"
zune-jpeg = "0.5"
zune-core = "0.5"

zenpixels = { version = ">=0.2.10, <0.4.0", default-features = false }

[dependencies.zenjpeg]
path = ".."
features = ["zencodec", "inventory", "extended-metadata", "metadata-rewrite"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

# This standalone workspace repeats the shared codec interface override.
[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", rev = "d327434b0826a3e39633665c76f5081c0ceb34cc" }

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

