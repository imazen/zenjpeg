# Boundary-RD / BBS examples (#91 / PR #102).
#
# `bbs_measure` is independent of boundary-RD (it measures block-boundary
# scores on any JPEG) so it stays outside the feature gate. `rd_explore`
# uses `auto_optimize` (trellis-only). The other three examples
# instantiate `BoundaryRd::On(...)` or call the boundary-RD harness
# directly — they require `--features boundary-rd`.
[[example]]
name = "bbs_measure"

[[example]]
