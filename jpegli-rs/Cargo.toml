[package]
name = "jpegli-rs"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/imazen/jpegli-rs"
documentation = "https://docs.rs/jpegli-rs"
readme = "README.md"
description = "Pure Rust JPEG encoder/decoder - port of Google's jpegli with perceptual optimizations"
keywords = ["jpeg", "image", "encoder", "decoder", "compression"]
categories = ["multimedia::images", "encoding"]
authors = ["Lilith River <lilith@imazen.io>"]
rust-version = "1.70"

[lib]
name = "jpegli"  # Keep import name as `use jpegli` for compatibility

[dependencies]
wide = { workspace = true }
bytemuck = { workspace = true }
arrayref = { workspace = true }
rgb = { workspace = true }
imgref = { workspace = true }
multiversion = { workspace = true }
lcms2 = { workspace = true, optional = true }
moxcms = { workspace = true, optional = true }
jpeg-decoder = { workspace = true, optional = true }
butteraugli-oxide = { workspace = true }

[dev-dependencies]
chrono = "0.4"
approx = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
test-case = { workspace = true }
png = { workspace = true }
dssim = { workspace = true }
ssimulacra2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
zune-jpeg = { workspace = true }
mozjpeg = { workspace = true }
jpeg-decoder = { workspace = true }

# For FFI comparison testing (internal parity tests only - requires C++ build)
# Uncomment locally when running parity tests:
# jpegli-internals-sys = { path = "../internal/jpegli-internals-sys", features = ["butteraugli"] }

[features]
default = ["simd", "cms"]
simd = []
cms = ["cms-lcms2"]  # Default CMS backend
cms-lcms2 = ["dep:lcms2", "dep:jpeg-decoder"]
cms-moxcms = ["dep:moxcms", "dep:jpeg-decoder"]
# Enable debug token serialization for C++ comparison
debug-tokens = []
# Enable test utilities (image generation, quality verification)
test-utils = []

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "decode"
harness = false

[lints]
workspace = true

# Examples that require test-utils feature
[[example]]
name = "benchmark_xyb_vs_ycbcr"
required-features = ["test-utils"]

[[example]]
name = "compare_coefficients"
required-features = ["test-utils"]

[[example]]
name = "compare_decoded"
required-features = ["test-utils"]

[[example]]
name = "compare_quality"
required-features = ["test-utils"]

[[example]]
name = "compare_quant_tables"
required-features = ["test-utils"]

[[example]]
name = "compare_to_original"
required-features = ["test-utils"]

[[example]]
name = "compare_xyb_constants"
required-features = ["test-utils"]

[[example]]
name = "debug_aq_values"
required-features = ["test-utils"]

[[example]]
name = "debug_quant_field"
required-features = ["test-utils"]

[[example]]
name = "generate_cpp_reference"
required-features = ["test-utils"]

[[example]]
name = "low_q_report"
required-features = ["test-utils"]

[[example]]
name = "quality_comparison"
required-features = ["test-utils"]

[[example]]
name = "xyb_butteraugli_comparison"
required-features = ["test-utils"]

[[example]]
name = "xyb_distance_comparison"
required-features = ["test-utils"]

[[example]]
name = "xyb_same_size_comparison"
required-features = ["test-utils"]

[[example]]
name = "xyb_ssimulacra2_comparison"
required-features = ["test-utils"]

[[example]]
name = "xyb_vs_ycbcr_comparison"
required-features = ["test-utils"]

[[example]]
