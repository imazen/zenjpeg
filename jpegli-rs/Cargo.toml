[package]
name = "jpegli-rs"
version = "0.4.1"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/imazen/jpegli-rs"
documentation = "https://docs.rs/jpegli-rs"
readme = "README.md"
description = "Pure Rust JPEG encoder/decoder - port of Google's jpegli with perceptual optimizations"
keywords = ["jpeg", "image", "encoder", "decoder", "compression"]
categories = ["multimedia::images", "encoding"]
authors = ["Lilith River <lilith@imazen.io>"]
rust-version = "1.70"

[lib]
name = "jpegli"  # Keep import name as `use jpegli` for compatibility

[dependencies]
wide = { workspace = true }
aligned-vec = { workspace = true }
bytemuck = { workspace = true }
rgb = { workspace = true }
imgref = { workspace = true }
multiversion = { workspace = true }
enough = { workspace = true }
lcms2 = { workspace = true, optional = true }
moxcms = { workspace = true, optional = true }
zune-jpeg = { workspace = true, optional = true }  # For CMS decode helper
rayon = { workspace = true, optional = true }  # For parallel encoding
# Hybrid trellis quantization from mozjpeg
mozjpeg-rs = { workspace = true, optional = true }

[dev-dependencies]
# NOTE: default-features = false to avoid complex FFI linking requirements
# cjpegli-ffi requires libjpeg-compatible symbols which aren't in jpegli-static
jpegli-bench-utils = { path = "../jpegli-bench-utils", default-features = false }
# For FFI comparison testing against C++ jpegli (internal development only)
# This dependency is NOT published to crates.io - it requires building the C++ jpegli
# from source via cmake. Only works in a local checkout with the C++ submodule.
# Tests using this are gated by #[cfg(feature = "ffi-tests")]
jpegli-internals-sys = { path = "../internal/jpegli-internals-sys", features = ["butteraugli"] }
almost-enough = { workspace = true }
butteraugli = { workspace = true }
chrono = "0.4"
approx = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
test-case = { workspace = true }
png = { workspace = true }
dssim = { workspace = true }
fast-ssim2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
zune-jpeg = { workspace = true }
# NOTE: mozjpeg conflicts with jpegli FFI - both provide libjpeg-62 symbols!
# Only enable for mozjpeg-specific benchmarks, not when using cjpegli-ffi
# mozjpeg = { workspace = true }
rayon = { workspace = true }
sha2 = "0.10"
# Note: turbojpeg conflicts with mozjpeg (duplicate libjpeg symbols)
# turbojpeg = { workspace = true }

[features]
default = ["cms", "test-utils"]
# Enable the decoder API. The decoder is still in prerelease with frequent breaking changes.
# When disabled, no decoder types or functions are available in the public API.
decoder = []
parallel = ["dep:rayon"]  # Enable parallel encoding (multi-threaded DCT/quantization)
# Opt-in raw AVX2/SSE intrinsics for x86_64. Provides ~10-20% speedup on supported CPUs.
# Without this, all SIMD uses safe `wide` crate which auto-vectorizes on all platforms.
unsafe_simd = []
cms = ["cms-lcms2"]  # Default CMS backend
# FFI tests against C++ jpegli for parity verification (local development only)
# Requires: git submodule, cmake, C++ toolchain. Not usable from crates.io.
# Tests check for this feature with #[cfg(feature = "ffi-tests")]
ffi-tests = []
# Enable corpus comparison tests (requires codec-eval)
#corpus-tests = ["dep:codec-eval"]
cms-lcms2 = ["dep:lcms2", "dep:zune-jpeg"]
cms-moxcms = ["dep:moxcms", "dep:zune-jpeg"]
# Enable debug token serialization for C++ comparison
debug-tokens = []
# Enable test utilities (image generation, quality verification)
test-utils = []
# Enable WASM SIMD128 tests (requires wasm runtime with SIMD support)
# Build with: RUSTFLAGS="-C target-feature=+simd128" cargo build --target wasm32-wasip1
# Supported runtimes (2025): Wasmtime, Wasmer, Node.js, all major browsers
wasm-simd = []
# Enable hybrid trellis quantization (combines jpegli AQ + mozjpeg trellis)
experimental-hybrid-trellis = ["dep:mozjpeg-rs"]

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "decode"
harness = false
required-features = ["decoder"]

[[bench]]
name = "cpp_comparison"
harness = false

[[bench]]
name = "quick"
harness = false

[[bench]]
name = "profile_ycbcr"
harness = false

[[bench]]
name = "simd_blocks"
harness = false

[[bench]]
name = "dct"
harness = false

[[bench]]
name = "encode_matrix"
harness = false

[[bench]]
name = "simd_load"
harness = false

[lints]
workspace = true

# Examples that require test-utils feature
[[example]]
name = "generate_cpp_reference"
required-features = ["test-utils"]

[[example]]
name = "low_q_report"
required-features = ["test-utils"]

# C++ comparison tools
[[example]]
name = "cpp_timing_matrix"
required-features = ["decoder", "test-utils"]

# XYB debugging tools (for investigating quality gap vs C++ jpegli)
[[example]]
name = "compare_xyb_constants"
required-features = ["test-utils", "ffi-tests"]
