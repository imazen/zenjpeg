name: CI

on:
  push:
    branches: [main, stepbystep2]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (jpegli-rs only)
        run: cargo clippy -p jpegli-rs --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p jpegli-rs --all-features
      - name: Run tests
        # Run lib and doc tests only; integration tests require C++ build
        run: cargo test -p jpegli-rs --lib --all-features

  test-features:
    name: Test feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test no default features
        run: cargo test -p jpegli-rs --no-default-features
      - name: Test simd only
        run: cargo test -p jpegli-rs --no-default-features --features simd
      - name: Test cms-lcms2
        run: cargo test -p jpegli-rs --no-default-features --features simd,cms-lcms2
      - name: Test cms-moxcms
        run: cargo test -p jpegli-rs --no-default-features --features simd,cms-moxcms

  msrv:
    name: MSRV (1.70)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.70
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        run: cargo check -p jpegli-rs --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc -p jpegli-rs --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Parity tests require the C++ submodule and build tools
  # Run these on a schedule or manually, not on every PR
  parity-tests:
    name: C++ Parity Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install C++ build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            libbrotli-dev libgif-dev libjpeg-dev libpng-dev libwebp-dev
      - name: Build C++ jpegli
        run: |
          cd internal/jpegli-cpp
          mkdir -p build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DJPEGXL_ENABLE_TOOLS=ON \
            -DJPEGXL_ENABLE_JPEGLI_LIBJPEG=ON \
            -DJPEGXL_ENABLE_SJPEG=OFF ..
          ninja jpegli-static cjpegli
      - name: Run parity tests
        run: cargo test --workspace -- --ignored
