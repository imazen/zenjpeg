name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (jpegli-rs only)
        run: cargo clippy -p jpegli-rs --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 targets
          - os: ubuntu
            arch: x64
            runner: ubuntu-latest
          - os: macos
            arch: x64
            runner: macos-13  # Intel Mac
          - os: windows
            arch: x64
            runner: windows-latest
          # ARM targets
          - os: ubuntu
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: arm64
            runner: macos-latest  # Apple Silicon
          - os: windows
            arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.arch }}
      - name: Build
        run: cargo build -p jpegli-rs --all-features
      - name: Run tests
        run: cargo test -p jpegli-rs --lib --all-features

  test-features:
    name: Test feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test no default features
        run: cargo test -p jpegli-rs --no-default-features
      - name: Test simd only
        run: cargo test -p jpegli-rs --no-default-features --features simd
      - name: Test cms-lcms2
        run: cargo test -p jpegli-rs --no-default-features --features simd,cms-lcms2
      - name: Test cms-moxcms
        run: cargo test -p jpegli-rs --no-default-features --features simd,cms-moxcms

  msrv:
    name: MSRV (1.70)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.70
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        run: cargo check -p jpegli-rs --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc -p jpegli-rs --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Parity tests require the C++ submodule and build tools
  parity-tests:
    name: C++ Parity Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install C++ build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            libbrotli-dev libgif-dev libjpeg-dev libpng-dev libwebp-dev
      - name: Build C++ jpegli
        run: |
          cd internal/jpegli-cpp
          mkdir -p build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DJPEGXL_ENABLE_TOOLS=ON \
            -DJPEGXL_ENABLE_JPEGLI_LIBJPEG=ON \
            -DJPEGXL_ENABLE_SJPEG=OFF ..
          ninja jpegli-static cjpegli
      - name: Run parity tests
        run: cargo test -p jpegli-rs --release -- --ignored
