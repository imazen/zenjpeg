name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Clone sibling repos
        shell: bash
        run: |
          cd ..
          git clone --depth 1 https://github.com/imazen/zencodec-types.git
          git clone --depth 1 https://github.com/imazen/zenpixels.git
          git clone --depth 1 https://github.com/imazen/zenlayout.git
          git clone --depth 1 https://github.com/imazen/zenresize.git
          git clone --depth 1 https://github.com/imazen/ultrahdr.git
          git clone --depth 1 https://github.com/imazen/linear-srgb.git
          git clone --depth 1 https://github.com/imazen/colorutils-rs.git

      - name: Remove non-CI workspace members and deps
        shell: bash
        run: |
          # Remove jpegli-internals-sys (requires C++ build) and ultrahdr-rs (needs zune-image)
          sed -e '/"internal\/jpegli-internals-sys"/d' Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          sed \
            -e '/jpegli-internals-sys/d' \
            -e '/ultrahdr-rs.*workspace/d' \
            zenjpeg/Cargo.toml > zenjpeg/Cargo.toml.ci && mv zenjpeg/Cargo.toml.ci zenjpeg/Cargo.toml
          rm -f Cargo.lock

      - name: Test (zenjpeg)
        run: cargo test -p zenjpeg --release

      - name: Test (zjpeg)
        run: cargo test -p zjpeg --release

  i686:
    name: Test (i686)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-i686

      - name: Clone sibling repos
        shell: bash
        run: |
          cd ..
          git clone --depth 1 https://github.com/imazen/zencodec-types.git
          git clone --depth 1 https://github.com/imazen/zenpixels.git
          git clone --depth 1 https://github.com/imazen/zenlayout.git
          git clone --depth 1 https://github.com/imazen/zenresize.git
          git clone --depth 1 https://github.com/imazen/ultrahdr.git
          git clone --depth 1 https://github.com/imazen/linear-srgb.git
          git clone --depth 1 https://github.com/imazen/colorutils-rs.git

      - name: Remove non-CI workspace members and deps
        shell: bash
        run: |
          sed -e '/"internal\/jpegli-internals-sys"/d' Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          sed \
            -e '/jpegli-internals-sys/d' \
            -e '/ultrahdr-rs.*workspace/d' \
            zenjpeg/Cargo.toml > zenjpeg/Cargo.toml.ci && mv zenjpeg/Cargo.toml.ci zenjpeg/Cargo.toml
          rm -f Cargo.lock

      - name: Test (i686)
        run: cross test -p zenjpeg --target i686-unknown-linux-gnu

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clone sibling repos
        shell: bash
        run: |
          cd ..
          git clone --depth 1 https://github.com/imazen/zencodec-types.git
          git clone --depth 1 https://github.com/imazen/zenpixels.git
          git clone --depth 1 https://github.com/imazen/zenlayout.git
          git clone --depth 1 https://github.com/imazen/zenresize.git
          git clone --depth 1 https://github.com/imazen/ultrahdr.git
          git clone --depth 1 https://github.com/imazen/linear-srgb.git
          git clone --depth 1 https://github.com/imazen/colorutils-rs.git

      - name: Remove non-CI workspace members and deps
        shell: bash
        run: |
          sed -e '/"internal\/jpegli-internals-sys"/d' Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          sed \
            -e '/jpegli-internals-sys/d' \
            -e '/ultrahdr-rs.*workspace/d' \
            zenjpeg/Cargo.toml > zenjpeg/Cargo.toml.ci && mv zenjpeg/Cargo.toml.ci zenjpeg/Cargo.toml
          rm -f Cargo.lock

      - name: Clippy
        run: cargo clippy -p zenjpeg -p zjpeg --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2

      - name: Clone sibling repos
        shell: bash
        run: |
          cd ..
          git clone --depth 1 https://github.com/imazen/zencodec-types.git
          git clone --depth 1 https://github.com/imazen/zenpixels.git
          git clone --depth 1 https://github.com/imazen/zenlayout.git
          git clone --depth 1 https://github.com/imazen/zenresize.git
          git clone --depth 1 https://github.com/imazen/ultrahdr.git
          git clone --depth 1 https://github.com/imazen/linear-srgb.git
          git clone --depth 1 https://github.com/imazen/colorutils-rs.git

      - name: Remove non-CI workspace members and deps
        shell: bash
        run: |
          sed -e '/"internal\/jpegli-internals-sys"/d' Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          sed \
            -e '/jpegli-internals-sys/d' \
            -e '/ultrahdr-rs.*workspace/d' \
            zenjpeg/Cargo.toml > zenjpeg/Cargo.toml.ci && mv zenjpeg/Cargo.toml.ci zenjpeg/Cargo.toml
          rm -f Cargo.lock

      - name: Check MSRV
        run: cargo hack check -p zenjpeg --rust-version

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      - name: Clone sibling repos
        shell: bash
        run: |
          cd ..
          git clone --depth 1 https://github.com/imazen/zencodec-types.git
          git clone --depth 1 https://github.com/imazen/zenpixels.git
          git clone --depth 1 https://github.com/imazen/zenlayout.git
          git clone --depth 1 https://github.com/imazen/zenresize.git
          git clone --depth 1 https://github.com/imazen/ultrahdr.git
          git clone --depth 1 https://github.com/imazen/linear-srgb.git
          git clone --depth 1 https://github.com/imazen/colorutils-rs.git

      - name: Remove non-CI workspace members and deps
        shell: bash
        run: |
          sed -e '/"internal\/jpegli-internals-sys"/d' Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          sed \
            -e '/jpegli-internals-sys/d' \
            -e '/ultrahdr-rs.*workspace/d' \
            zenjpeg/Cargo.toml > zenjpeg/Cargo.toml.ci && mv zenjpeg/Cargo.toml.ci zenjpeg/Cargo.toml
          rm -f Cargo.lock

      - name: Generate coverage
        run: cargo llvm-cov -p zenjpeg --lcov --output-path lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
