name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable

      - name: Clone sibling repos
        shell: bash
        run: |
          cd ..
          git clone --depth 1 https://github.com/imazen/zencodec.git
          git clone --depth 1 https://github.com/imazen/ultrahdr.git
          git clone --depth 1 https://github.com/imazen/zenpng.git
          git clone --depth 1 https://github.com/imazen/zenflate.git
          # Path-pinned by ultrahdr-core's [patch.crates-io] for the in-flight
          # zenpixels 0.2.11 (RgbaF16) and by zenjpeg's `ultrahdr` feature for
          # zentone (Bt2446C in encode_ultrahdr_luma). Both unpublished.
          git clone --depth 1 https://github.com/imazen/zenpixels.git
          git clone --depth 1 https://github.com/imazen/zentone.git

      - name: Strip non-CI workspace members and deps
        shell: bash
        run: |
          # Remove workspace members that can't build in CI
          sed \
            -e '/"internal\/jpegli-internals-sys"/d' \
            -e '/"zjpeg"/d' \
            Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          # Remove zenresize workspace dep (needs zenblend/zennode chain)
          sed -e '/^zenresize/d' Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          # Remove non-CI deps from zenjpeg
          sed \
            -e '/jpegli-internals-sys/d' \
            -e '/zenresize.*workspace/d' \
            -e '/zennode.*path/d' \
            -e 's/^layout = .*/layout = []/' \
            -e 's/^zennode = .*/zennode = []/' \
            -e 's/, features = \["cjpegli-ffi"\]//' \
            zenjpeg/Cargo.toml > zenjpeg/Cargo.toml.ci && mv zenjpeg/Cargo.toml.ci zenjpeg/Cargo.toml
          rm -f Cargo.lock

      - uses: Swatinem/rust-cache@v2

      - name: Test (defaults)
        run: cargo test -p zenjpeg --release --lib --tests

      - name: Test (all user features)
        run: cargo test -p zenjpeg --release --features "trellis,parallel,moxcms,ultrahdr,zencodec" --lib --tests

      - name: Test (no defaults, decoder only)
        run: cargo test -p zenjpeg --release --no-default-features --features decoder --lib --tests

  i686:
    name: Test (i686)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross

      - name: Clone sibling repos
        shell: bash
        run: |
          cd ..
          git clone --depth 1 https://github.com/imazen/zencodec.git
          git clone --depth 1 https://github.com/imazen/ultrahdr.git
          git clone --depth 1 https://github.com/imazen/zenpng.git
          git clone --depth 1 https://github.com/imazen/zenflate.git
          # Path-pinned by ultrahdr-core's [patch.crates-io] for the in-flight
          # zenpixels 0.2.11 (RgbaF16) and by zenjpeg's `ultrahdr` feature for
          # zentone (Bt2446C in encode_ultrahdr_luma). Both unpublished.
          git clone --depth 1 https://github.com/imazen/zenpixels.git
          git clone --depth 1 https://github.com/imazen/zentone.git

      - name: Strip non-CI workspace members and deps
        shell: bash
        run: |
          sed \
            -e '/"internal\/jpegli-internals-sys"/d' \
            -e '/"zjpeg"/d' \
            Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          sed -e '/^zenresize/d' Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          # Replace ultrahdr path deps with published versions for cross
          # (container can't see ../ultrahdr/). The ultrahdr feature isn't used for
          # i686 testing, but workspace deps must still resolve.
          sed \
            -e 's|ultrahdr-rs = { path = "[^"]*" }|ultrahdr-rs = "0.3"|' \
            -e 's|ultrahdr-core = { path = "[^"]*", version = "[^"]*", \(.*\)}|ultrahdr-core = { version = "0.3", \1}|' \
            Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          sed \
            -e '/jpegli-internals-sys/d' \
            -e '/zenresize.*workspace/d' \
            -e '/zennode.*path/d' \
            -e 's/^layout = .*/layout = []/' \
            -e 's/^zennode = .*/zennode = []/' \
            -e 's/, features = \["cjpegli-ffi"\]//' \
            zenjpeg/Cargo.toml > zenjpeg/Cargo.toml.ci && mv zenjpeg/Cargo.toml.ci zenjpeg/Cargo.toml
          # Strip path overrides from ultrahdr deps in subcrate (cross can't see sibling repos)
          sed -e 's|, path = "../../ultrahdr/[^"]*"||g' \
            zenjpeg/Cargo.toml > zenjpeg/Cargo.toml.ci && mv zenjpeg/Cargo.toml.ci zenjpeg/Cargo.toml
          # Disable the `ultrahdr` feature: it pulls `ultrahdr-core/zentone` which
          # only exists in 0.4+; the i686 strip pins 0.3 to keep cross-build cheap.
          # Replace the feature definition with a no-op so any caller asking for it
          # fails open instead of breaking workspace metadata resolution.
          sed -e 's|^ultrahdr = \[.*\]$|ultrahdr = []|' \
            zenjpeg/Cargo.toml > zenjpeg/Cargo.toml.ci && mv zenjpeg/Cargo.toml.ci zenjpeg/Cargo.toml
          rm -f Cargo.lock

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-i686

      - name: Test (i686)
        # Skip two tests that require sparse-cloning the full image-rs/image
        # repo. codec-corpus bundles its own test corpora (so zune/fuzz tests
        # work) but image-rs/tests/images is fetched from the separate
        # image-rs/image repo, which the cross container's constrained network
        # times out on. Unrelated to 32-bit correctness.
        run: |
          cross test -p zenjpeg --target i686-unknown-linux-gnu --lib --tests -- \
            --skip codec_corpus_conformance::test_image_rs_general \
            --skip codec_corpus_conformance::test_image_rs_progressive
        env:
          CODEC_CORPUS_CACHE: /tmp/codec-corpus

  wasm32:
    name: Build (wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Clone sibling repos
        shell: bash
        run: |
          cd ..
          git clone --depth 1 https://github.com/imazen/zencodec.git
          git clone --depth 1 https://github.com/imazen/ultrahdr.git
          git clone --depth 1 https://github.com/imazen/zenpng.git
          git clone --depth 1 https://github.com/imazen/zenflate.git
          # Path-pinned by ultrahdr-core's [patch.crates-io] for the in-flight
          # zenpixels 0.2.11 (RgbaF16) and by zenjpeg's `ultrahdr` feature for
          # zentone (Bt2446C in encode_ultrahdr_luma). Both unpublished.
          git clone --depth 1 https://github.com/imazen/zenpixels.git
          git clone --depth 1 https://github.com/imazen/zentone.git

      - name: Strip non-CI workspace members and deps
        shell: bash
        run: |
          sed \
            -e '/"internal\/jpegli-internals-sys"/d' \
            -e '/"zjpeg"/d' \
            Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          sed -e '/^zenresize/d' Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          sed \
            -e '/jpegli-internals-sys/d' \
            -e '/zenresize.*workspace/d' \
            -e '/zennode.*path/d' \
            -e 's/^layout = .*/layout = []/' \
            -e 's/^zennode = .*/zennode = []/' \
            -e 's/, features = \["cjpegli-ffi"\]//' \
            zenjpeg/Cargo.toml > zenjpeg/Cargo.toml.ci && mv zenjpeg/Cargo.toml.ci zenjpeg/Cargo.toml
          rm -f Cargo.lock

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip1

      - name: Build (scalar)
        run: cargo build -p zenjpeg --target wasm32-wasip1 --no-default-features --features decoder

      - name: Build (SIMD128)
        env:
          RUSTFLAGS: "-C target-feature=+simd128"
        run: cargo build -p zenjpeg --target wasm32-wasip1 --no-default-features --features decoder

      - name: Build wasm_bench example (SIMD128)
        env:
          RUSTFLAGS: "-C target-feature=+simd128"
        run: cargo build --release -p zenjpeg --target wasm32-wasip1 --example wasm_bench --no-default-features --features decoder

  cpp-parity:
    name: C++ Parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Clone required submodules (skip skcms — not needed, hosted on unreliable skia.googlesource.com)
        shell: bash
        timeout-minutes: 10
        run: |
          git submodule update --init internal/jpegli-cpp
          cd internal/jpegli-cpp
          git submodule update --init third_party/lcms third_party/googletest third_party/highway third_party/libpng third_party/zlib third_party/libjpeg-turbo testdata
      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tools and libjpeg-turbo
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y cmake ninja-build libjpeg-turbo-progs
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install jpeg-turbo
            echo "$(brew --prefix jpeg-turbo)/bin" >> "$GITHUB_PATH"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            choco install libjpeg-turbo --yes --no-progress
            echo "C:\\libjpeg-turbo64\\bin" >> "$GITHUB_PATH"
          fi
          cmake --version
          djpeg -version || djpeg --version || echo "djpeg not in PATH yet (will be available after PATH update)"

      - name: Clone sibling repos
        shell: bash
        run: |
          cd ..
          git clone --depth 1 https://github.com/imazen/zencodec.git
          git clone --depth 1 https://github.com/imazen/ultrahdr.git
          git clone --depth 1 https://github.com/imazen/zenpng.git
          git clone --depth 1 https://github.com/imazen/zenflate.git
          # Path-pinned by ultrahdr-core's [patch.crates-io] for the in-flight
          # zenpixels 0.2.11 (RgbaF16) and by zenjpeg's `ultrahdr` feature for
          # zentone (Bt2446C in encode_ultrahdr_luma). Both unpublished.
          git clone --depth 1 https://github.com/imazen/zenpixels.git
          git clone --depth 1 https://github.com/imazen/zentone.git

      - name: Strip non-CI workspace members and deps (keep jpegli-internals-sys)
        shell: bash
        run: |
          # Remove zjpeg only (keep jpegli-internals-sys)
          sed \
            -e '/"zjpeg"/d' \
            Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          # Remove zenresize workspace dep (needs zenblend/zennode chain)
          sed -e '/^zenresize/d' Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          # Remove non-CI deps from zenjpeg (keep jpegli-internals-sys and cjpegli-ffi)
          sed \
            -e '/zenresize.*workspace/d' \
            -e '/zennode.*path/d' \
            -e 's/^layout = .*/layout = []/' \
            -e 's/^zennode = .*/zennode = []/' \
            zenjpeg/Cargo.toml > zenjpeg/Cargo.toml.ci && mv zenjpeg/Cargo.toml.ci zenjpeg/Cargo.toml
          rm -f Cargo.lock

      - uses: Swatinem/rust-cache@v2
        with:
          key: cpp-parity

      - name: Build C++ jpegli tools (cjpegli, djpegli)
        shell: bash
        run: |
          cd internal/jpegli-cpp
          # Use 'build' dir (matches find_cjpegli() search path).
          # On Windows, match /MD (dynamic CRT) to avoid LNK2038 with cc crate.
          CMAKE_EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            CMAKE_EXTRA="-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DJPEGXL_ENABLE_TOOLS=ON \
            -DJPEGXL_ENABLE_JPEGLI_LIBJPEG=ON \
            -DJPEGXL_STATIC=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DJPEGXL_ENABLE_DOXYGEN=OFF \
            -DJPEGXL_ENABLE_MANPAGES=OFF \
            -DJPEGXL_ENABLE_BENCHMARK=OFF \
            -DJPEGXL_ENABLE_EXAMPLES=OFF \
            -DJPEGXL_ENABLE_JNI=OFF \
            -DJPEGXL_ENABLE_SJPEG=OFF \
            -DJPEGXL_ENABLE_OPENEXR=OFF \
            -DJPEGXL_ENABLE_SKCMS=OFF \
            -DJPEGXL_ENABLE_TCMALLOC=OFF \
            -DJPEGXL_ENABLE_FUZZERS=OFF \
            -DJPEGXL_ENABLE_VIEWERS=OFF \
            -DJPEGXL_BUNDLE_LIBPNG=OFF \
            $CMAKE_EXTRA
          cmake --build build --target cjpegli djpegli --config Release --parallel

      - name: Build (includes C++ jpegli compilation)
        run: cargo build -p zenjpeg --release --tests --features "trellis,parallel,moxcms,ultrahdr,zencodec,__ffi-tests,__test-utils"

      - name: Test (all features + C++ FFI parity)
        run: cargo test -p zenjpeg --release --lib --tests --features "trellis,parallel,moxcms,ultrahdr,zencodec,__ffi-tests,__test-utils"

      - name: Upload failing JPEGs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zune-fail-${{ matrix.os }}-${{ github.sha }}
          path: /tmp/zune_fail_*.jpg
          if-no-files-found: ignore

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clone sibling repos
        shell: bash
        run: |
          cd ..
          git clone --depth 1 https://github.com/imazen/zencodec.git
          git clone --depth 1 https://github.com/imazen/ultrahdr.git
          git clone --depth 1 https://github.com/imazen/zenpng.git
          git clone --depth 1 https://github.com/imazen/zenflate.git
          # Path-pinned by ultrahdr-core's [patch.crates-io] for the in-flight
          # zenpixels 0.2.11 (RgbaF16) and by zenjpeg's `ultrahdr` feature for
          # zentone (Bt2446C in encode_ultrahdr_luma). Both unpublished.
          git clone --depth 1 https://github.com/imazen/zenpixels.git
          git clone --depth 1 https://github.com/imazen/zentone.git

      - name: Strip non-CI workspace members and deps
        shell: bash
        run: |
          sed \
            -e '/"internal\/jpegli-internals-sys"/d' \
            -e '/"zjpeg"/d' \
            Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          sed -e '/^zenresize/d' Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          # ultrahdr path deps kept — sibling repos are cloned above
          sed \
            -e '/jpegli-internals-sys/d' \
            -e '/zenresize.*workspace/d' \
            -e '/zennode.*path/d' \
            -e 's/^layout = .*/layout = []/' \
            -e 's/^zennode = .*/zennode = []/' \
            -e 's/, features = \["cjpegli-ffi"\]//' \
            zenjpeg/Cargo.toml > zenjpeg/Cargo.toml.ci && mv zenjpeg/Cargo.toml.ci zenjpeg/Cargo.toml
          rm -f Cargo.lock

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (all features)
        run: cargo clippy -p zenjpeg --lib --tests --benches --features "trellis,parallel,moxcms,ultrahdr,zencodec,__test-utils" -- -D warnings

      - name: Clippy (default features)
        run: cargo clippy -p zenjpeg --lib --tests --benches -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Clone sibling repos
        shell: bash
        run: |
          cd ..
          git clone --depth 1 https://github.com/imazen/zencodec.git
          git clone --depth 1 https://github.com/imazen/ultrahdr.git
          git clone --depth 1 https://github.com/imazen/zenpng.git
          git clone --depth 1 https://github.com/imazen/zenflate.git
          # Path-pinned by ultrahdr-core's [patch.crates-io] for the in-flight
          # zenpixels 0.2.11 (RgbaF16) and by zenjpeg's `ultrahdr` feature for
          # zentone (Bt2446C in encode_ultrahdr_luma). Both unpublished.
          git clone --depth 1 https://github.com/imazen/zenpixels.git
          git clone --depth 1 https://github.com/imazen/zentone.git

      - name: Strip non-CI workspace members and deps
        shell: bash
        run: |
          sed \
            -e '/"internal\/jpegli-internals-sys"/d' \
            -e '/"zjpeg"/d' \
            Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          sed -e '/^zenresize/d' Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          # ultrahdr path deps kept — sibling repos are cloned above
          sed \
            -e '/zenresize.*workspace/d' \
            -e '/zennode.*path/d' \
            -e 's/^layout = .*/layout = []/' \
            -e 's/^zennode = .*/zennode = []/' \
            -e 's/, features = \["cjpegli-ffi"\]//' \
            zenjpeg/Cargo.toml > zenjpeg/Cargo.toml.ci && mv zenjpeg/Cargo.toml.ci zenjpeg/Cargo.toml

      - name: Format check
        run: cargo fmt -p zenjpeg -p zenjpeg-bench-utils -- --check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
