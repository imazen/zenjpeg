name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not publish)'
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Fail before anything irreversible if the crates.io token is missing.
      # On 2026-06-01 (run 26756503782) this job ran the tests, built the docs,
      # created the GitHub Release for v0.8.4, and only THEN died on its last
      # step with "error: failed to publish zenjpeg v0.8.4 ... Caused by:
      # please provide a non-empty token". That left a published GitHub Release
      # for a version that was not on crates.io; 0.8.4 got there only because a
      # human published it by hand afterwards. Checking first turns a
      # half-completed release into a five-second, self-explaining failure.
      #
      # As of 2026-08-29 this repository has NO repository secrets at all, and
      # the only organization secret visible to it is CODECOV_TOKEN, so this
      # gate fails until someone adds CARGO_REGISTRY_TOKEN under
      # Settings -> Secrets and variables -> Actions. It is scoped to the real
      # publish path, so tag-less dispatches and dry runs are unaffected.
      - name: Require a crates.io token before releasing
        if: startsWith(github.ref, 'refs/tags/') && github.event.inputs.dry_run != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo '::error::CARGO_REGISTRY_TOKEN is empty or unset, so cargo publish cannot succeed. Add it under Settings -> Secrets and variables -> Actions, then re-run. Nothing has been released by this run.'
            exit 1
          fi
          echo 'crates.io token present.'

      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare workspace (clone siblings + strip non-CI members)
        uses: ./.github/actions/prepare-zenjpeg-workspace

      - uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name == "zenjpeg") | .version')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Run tests
        run: cargo test -p zenjpeg --release --features "parallel,moxcms,ultrahdr,zencodec"

      - name: Build docs
        run: cargo doc -p zenjpeg --no-deps --features "parallel,moxcms,ultrahdr,zencodec"

      - name: Publish (dry run)
        if: github.event.inputs.dry_run == 'true' || github.event_name == 'workflow_dispatch'
        run: cargo publish -p zenjpeg --dry-run --allow-dirty

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && github.event.inputs.dry_run != 'true'
        run: gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') && github.event.inputs.dry_run != 'true'
        run: cargo publish -p zenjpeg --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
