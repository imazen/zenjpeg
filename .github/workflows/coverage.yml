name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # public_api_doc test skips itself (needs nightly rustdoc + cargo-public-api;
  # the =check gate runs in ci.yml's clippy job only).
  ZEN_API_DOC: off

# Superseded runs only waste runner queue — particularly the macOS
# jobs, which wait on GitHub's scarcest pool. Only the newest
# commit's run matters per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Clone sibling repos
        shell: bash
        run: |
          cd ..
          git clone --depth 1 https://github.com/imazen/zencodec.git
          git clone --depth 1 https://github.com/imazen/zenpng.git
          git clone --depth 1 https://github.com/imazen/zenflate.git
          git clone --depth 1 https://github.com/imazen/zenanalyze.git

      - name: Strip non-CI workspace members and deps
        shell: bash
        run: |
          sed \
            -e '/"internal\/jpegli-internals-sys"/d' \
            -e '/"zjpeg"/d' \
            Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          sed -e '/^zenresize/d' Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          sed \
            -e '/jpegli-internals-sys/d' \
            -e '/zenresize.*workspace/d' \
            -e '/zennode.*path/d' \
            -e 's/^layout = .*/layout = []/' \
            -e 's/^zennode = .*/zennode = []/' \
            -e 's/, features = \["cjpegli-ffi"\]//' \
            zenjpeg/Cargo.toml > zenjpeg/Cargo.toml.ci && mv zenjpeg/Cargo.toml.ci zenjpeg/Cargo.toml
          rm -f Cargo.lock

      - uses: Swatinem/rust-cache@v2

      - name: Generate coverage (lib + integration tests)
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report -p zenjpeg --lib --features "parallel,moxcms,ultrahdr,zencodec,__test-utils"
          cargo llvm-cov --no-report -p zenjpeg --tests --features "parallel,moxcms,ultrahdr,zencodec,__test-utils" -- --skip ignored
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate HTML report
        run: cargo llvm-cov report --html --output-dir coverage-html

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html/
          retention-days: 30

  codec-coverage:
    name: Codec Path Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Clone sibling repos
        shell: bash
        run: |
          cd ..
          git clone --depth 1 https://github.com/imazen/zencodec.git
          git clone --depth 1 https://github.com/imazen/zenpng.git
          git clone --depth 1 https://github.com/imazen/zenflate.git
          git clone --depth 1 https://github.com/imazen/zenanalyze.git

      - name: Strip non-CI workspace members and deps
        shell: bash
        run: |
          sed \
            -e '/"internal\/jpegli-internals-sys"/d' \
            -e '/"zjpeg"/d' \
            Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          sed -e '/^zenresize/d' Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          sed \
            -e '/jpegli-internals-sys/d' \
            -e '/zenresize.*workspace/d' \
            -e '/zennode.*path/d' \
            -e 's/^layout = .*/layout = []/' \
            -e 's/^zennode = .*/zennode = []/' \
            -e 's/, features = \["cjpegli-ffi"\]//' \
            zenjpeg/Cargo.toml > zenjpeg/Cargo.toml.ci && mv zenjpeg/Cargo.toml.ci zenjpeg/Cargo.toml
          rm -f Cargo.lock

      - uses: Swatinem/rust-cache@v2

      - name: Run codec coverage tests
        run: |
          cargo llvm-cov clean --workspace
          # codec_coverage is now a module inside the `bundled` test binary
          # (see bundle PR #69). Filter by the `codec_coverage::` prefix so
          # only that module's 62 tests run.
          cargo llvm-cov --no-report -p zenjpeg --test bundled --features "parallel,moxcms,ultrahdr,zencodec,__test-utils" -- codec_coverage::
          cargo llvm-cov report --json --output-path codec-coverage.json

      - name: Check encode/decode coverage
        run: |
          echo "=== Codec Coverage Summary ==="
          echo "Codec coverage tests completed successfully"
