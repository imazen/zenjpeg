name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual trigger
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Patch path deps to git refs
        shell: bash
        run: |
          # Patch workspace root Cargo.toml
          sed \
            -e 's|path = "\.\./zencodec-types"|git = "https://github.com/imazen/zencodec-types"|g' \
            -e 's|path = "\.\./zenpixels/zenpixels"|git = "https://github.com/imazen/zenpixels"|g' \
            -e 's|path = "\.\./zenlayout"|git = "https://github.com/imazen/zenlayout"|g' \
            -e 's|path = "\.\./zenresize"|git = "https://github.com/imazen/zenresize"|g' \
            -e '/ultrahdr-rs/d' \
            -e 's|path = "\.\./ultrahdr/ultrahdr-core", ||g' \
            -e '/"internal\/jpegli-internals-sys"/d' \
            Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          printf '\n[patch.crates-io]\nzenpixels = { git = "https://github.com/imazen/zenpixels" }\nzenpixels-convert = { git = "https://github.com/imazen/zenpixels" }\n' >> Cargo.toml
          # Patch zenjpeg member: remove dev-deps with missing workspace entries or local paths
          sed \
            -e '/ultrahdr-rs.*workspace/d' \
            -e '/jpegli-internals-sys/d' \
            zenjpeg/Cargo.toml > zenjpeg/Cargo.toml.ci && mv zenjpeg/Cargo.toml.ci zenjpeg/Cargo.toml
          rm -f Cargo.lock

      - name: Generate coverage (lib + integration tests)
        run: |
          cargo llvm-cov clean --workspace
          # Run lib tests with coverage
          cargo llvm-cov --no-report -p zenjpeg --lib --all-features
          # Run integration tests (non-ignored only - these don't need C++ build)
          cargo llvm-cov --no-report -p zenjpeg --tests --all-features -- --skip ignored
          # Generate combined report
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate HTML report
        run: cargo llvm-cov report --html --output-dir coverage-html

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html/
          retention-days: 30

  # Separate job for encode/decode path coverage summary
  codec-coverage:
    name: Codec Path Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Patch path deps to git refs
        shell: bash
        run: |
          # Patch workspace root Cargo.toml
          sed \
            -e 's|path = "\.\./zencodec-types"|git = "https://github.com/imazen/zencodec-types"|g' \
            -e 's|path = "\.\./zenpixels/zenpixels"|git = "https://github.com/imazen/zenpixels"|g' \
            -e 's|path = "\.\./zenlayout"|git = "https://github.com/imazen/zenlayout"|g' \
            -e 's|path = "\.\./zenresize"|git = "https://github.com/imazen/zenresize"|g' \
            -e '/ultrahdr-rs/d' \
            -e 's|path = "\.\./ultrahdr/ultrahdr-core", ||g' \
            -e '/"internal\/jpegli-internals-sys"/d' \
            Cargo.toml > Cargo.toml.ci && mv Cargo.toml.ci Cargo.toml
          printf '\n[patch.crates-io]\nzenpixels = { git = "https://github.com/imazen/zenpixels" }\nzenpixels-convert = { git = "https://github.com/imazen/zenpixels" }\n' >> Cargo.toml
          # Patch zenjpeg member: remove dev-deps with missing workspace entries or local paths
          sed \
            -e '/ultrahdr-rs.*workspace/d' \
            -e '/jpegli-internals-sys/d' \
            zenjpeg/Cargo.toml > zenjpeg/Cargo.toml.ci && mv zenjpeg/Cargo.toml.ci zenjpeg/Cargo.toml
          rm -f Cargo.lock

      - name: Run codec coverage tests
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report -p zenjpeg --test codec_coverage --all-features
          cargo llvm-cov report --json --output-path codec-coverage.json

      - name: Check encode/decode coverage
        run: |
          echo "=== Codec Coverage Summary ==="
          # Extract coverage percentages for encode.rs and decode.rs
          if command -v jq &> /dev/null; then
            echo "Coverage JSON generated at codec-coverage.json"
            # Note: Detailed parsing would require more complex jq queries
            # For now, we just verify the test runs successfully
          fi
          echo "Codec coverage tests completed successfully"
