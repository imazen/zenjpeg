name: Coverage

on:
  push:
    branches: [main, stepbystep2]
  pull_request:
    branches: [main]
  # Allow manual trigger
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Generate coverage (lib + integration tests)
        run: |
          cargo llvm-cov clean --workspace
          # Run lib tests with coverage
          cargo llvm-cov --no-report -p zenjpeg --lib --all-features
          # Run integration tests (non-ignored only - these don't need C++ build)
          cargo llvm-cov --no-report -p zenjpeg --tests --all-features -- --skip ignored
          # Generate combined report
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate HTML report
        run: cargo llvm-cov report --html --output-dir coverage-html

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html/
          retention-days: 30

  # Separate job for encode/decode path coverage summary
  codec-coverage:
    name: Codec Path Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Run codec coverage tests
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report -p zenjpeg --test codec_coverage --all-features
          cargo llvm-cov report --json --output-path codec-coverage.json

      - name: Check encode/decode coverage
        run: |
          echo "=== Codec Coverage Summary ==="
          # Extract coverage percentages for encode.rs and decode.rs
          if command -v jq &> /dev/null; then
            echo "Coverage JSON generated at codec-coverage.json"
            # Note: Detailed parsing would require more complex jq queries
            # For now, we just verify the test runs successfully
          fi
          echo "Codec coverage tests completed successfully"
