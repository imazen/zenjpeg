name: Benchmark

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Benchmark (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: aarch64-linux
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - arch: x86_64-macos
            os: macos-latest
            target: x86_64-apple-darwin
          - arch: aarch64-macos
            os: macos-latest
            target: aarch64-apple-darwin
          - arch: wasm32-simd
            os: ubuntu-latest
            target: wasm32-wasip1
            wasm: true

    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Prepare workspace (clone siblings + strip non-CI members)
        uses: ./.github/actions/prepare-zenjpeg-workspace

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-${{ matrix.arch }}

      # WASM: Install wasmtime
      - name: Install wasmtime
        if: matrix.wasm
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      # Native benchmarks
      - name: Run encode benchmarks (native)
        if: ${{ !matrix.wasm }}
        run: |
          cargo bench --bench encode -p zenjpeg --target ${{ matrix.target }} -- --noplot --save-baseline main 2>&1 | tee bench_output.txt

      - name: Run decode benchmarks (native)
        if: ${{ !matrix.wasm }}
        run: |
          cargo bench --bench decode -p zenjpeg --target ${{ matrix.target }} -- --noplot --save-baseline main 2>&1 | tee -a bench_output.txt

      # WASM benchmarks using wasmtime
      - name: Build WASM benchmark
        if: matrix.wasm
        # No `--features` list: zenjpeg has neither a `std` nor a `decoder`
        # feature (its `default` is `[]`), so the old
        # `--features "std,decoder"` failed the build outright with
        # "error: the package 'zenjpeg' does not contain these features:
        # decoder, std". Verified 2026-08-29 that this line builds clean.
        run: |
          RUSTFLAGS="-C target-feature=+simd128" cargo build --release --target wasm32-wasip1 -p zenjpeg --example wasm_bench --no-default-features

      - name: Run WASM benchmarks
        if: matrix.wasm
        run: |
          wasmtime run --wasm simd target/wasm32-wasip1/release/examples/wasm_bench.wasm 2>&1 | tee bench_output.txt

      - name: Parse benchmark results
        id: parse
        run: |
          mkdir -p benchmark-results

          python3 << 'EOF'
          import json
          import re
          import os

          arch = "${{ matrix.arch }}"
          results = []

          def parse_criterion_output(filename):
              with open(filename, 'r') as f:
                  content = f.read()

              # Match lines like: encode/rgb/512x512    time:   [1.2345 ms 1.2456 ms 1.2567 ms]
              pattern = r'(\S+)\s+time:\s+\[[\d.]+ \w+ ([\d.]+) (\w+)'

              for match in re.finditer(pattern, content):
                  name = match.group(1)
                  value = float(match.group(2))
                  unit = match.group(3)

                  # Convert to consistent units (nanoseconds)
                  if unit == 'ms':
                      value *= 1_000_000
                  elif unit == 'µs' or unit == 'us':
                      value *= 1_000
                  elif unit == 's':
                      value *= 1_000_000_000

                  # Prefix with architecture for separate tracking
                  results.append({
                      'name': f'{arch}/{name}',
                      'unit': 'ns',
                      'value': value
                  })

          if os.path.exists('bench_output.txt'):
              parse_criterion_output('bench_output.txt')

          with open('benchmark-results/results.json', 'w') as f:
              json.dump(results, f, indent=2)

          print(f"Parsed {len(results)} benchmark results for {arch}")
          EOF

          cat benchmark-results/results.json

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark-results/results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # This repo has no `gh-pages` branch, and the action fetches it
          # before doing anything -- even when auto-push is false -- so every
          # native leg died here with:
          #   Command 'git' failed ... fetch ... gh-pages:gh-pages:
          #   fatal: couldn't find remote ref gh-pages
          # That is what has been failing since the last run on 2026-03-31.
          #
          # HONEST LIMITATION: with no gh-pages branch there is no history, so
          # the alert-threshold comparison below has nothing to compare against
          # and this step now only validates and formats the current results.
          # `auto-push` is dead config too -- this workflow is
          # workflow_dispatch-only, so `github.event_name == 'push'` is never
          # true. Restoring real regression tracking means creating a gh-pages
          # branch AND putting back a push trigger; both are owner decisions,
          # so this change only stops the step from failing. The per-arch
          # results are still kept by "Upload benchmark artifacts" below.
          skip-fetch-gh-pages: true
          alert-threshold: '115%'
          comment-on-alert: true
          fail-on-alert: false
          max-items-in-chart: 100
          # Separate benchmark data per architecture
          benchmark-data-dir-path: dev/bench/${{ matrix.arch }}

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ matrix.arch }}
          path: |
            bench_output.txt
            benchmark-results/

  benchmark-summary:
    name: Benchmark Summary
    needs: benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: benchmark-*
          merge-multiple: false

      - name: Generate cross-platform comparison
        run: |
          echo "## Cross-Platform Benchmark Results" > summary.md
          echo "" >> summary.md

          for dir in benchmark-*/; do
            arch=$(basename "$dir" | sed 's/benchmark-//')
            echo "### $arch" >> summary.md
            echo '```' >> summary.md
            if [ -f "$dir/bench_output.txt" ]; then
              grep -E "time:" "$dir/bench_output.txt" | head -20 >> summary.md || echo "No results" >> summary.md
            else
              echo "No benchmark data" >> summary.md
            fi
            echo '```' >> summary.md
            echo "" >> summary.md
          done

          cat summary.md

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('summary.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Cross-Platform Benchmark')
            );

            const body = report + '\n\n*Updated: ' + new Date().toISOString() + '*';

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
