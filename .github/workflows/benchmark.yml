name: Benchmark

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Benchmark (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: aarch64-linux
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - arch: x86_64-macos
            os: macos-latest
            target: x86_64-apple-darwin
          - arch: aarch64-macos
            os: macos-latest
            target: aarch64-apple-darwin
          - arch: wasm32-simd
            os: ubuntu-latest
            target: wasm32-wasip1
            wasm: true

    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Prepare workspace (clone siblings + strip non-CI members)
        uses: ./.github/actions/prepare-zenjpeg-workspace

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-${{ matrix.arch }}

      # WASM: Install wasmtime
      - name: Install wasmtime
        if: matrix.wasm
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      # Native benchmarks
      - name: Run encode benchmarks (native)
        if: ${{ !matrix.wasm }}
        run: |
          cargo bench --bench encode -p zenjpeg --target ${{ matrix.target }} -- --noplot --save-baseline main 2>&1 | tee bench_output.txt

      - name: Run decode benchmarks (native)
        if: ${{ !matrix.wasm }}
        run: |
          cargo bench --bench decode -p zenjpeg --target ${{ matrix.target }} -- --noplot --save-baseline main 2>&1 | tee -a bench_output.txt

      # WASM benchmarks using wasmtime
      - name: Build WASM benchmark
        if: matrix.wasm
        # No `--features` list: zenjpeg has neither a `std` nor a `decoder`
        # feature (its `default` is `[]`), so the old
        # `--features "std,decoder"` failed the build outright with
        # "error: the package 'zenjpeg' does not contain these features:
        # decoder, std". Verified 2026-08-29 that this line builds clean.
        run: |
          RUSTFLAGS="-C target-feature=+simd128" cargo build --release --target wasm32-wasip1 -p zenjpeg --example wasm_bench --no-default-features

      - name: Run WASM benchmarks
        if: matrix.wasm
        run: |
          wasmtime run --wasm simd target/wasm32-wasip1/release/examples/wasm_bench.wasm 2>&1 | tee bench_output.txt

      - name: Parse benchmark results
        id: parse
        # Two formats, because the legs do not run the same harness: the
        # native legs run `cargo bench` (criterion), while the wasm leg runs
        # examples/wasm_bench.rs, which prints its own format. The old parser
        # only understood criterion, so the wasm leg silently produced `[]`
        # and github-action-benchmark then failed with the unhelpful
        # "No benchmark result was found". Both patterns are checked against
        # real captured output; an empty parse is now a loud error, not a
        # confusing one two steps later.
        run: |
          mkdir -p benchmark-results
          python3 << 'PYEOF'
          import json
          import re
          import os

          arch = "${{ matrix.arch }}"
          results = []

          # Nanoseconds per unit. Criterion prints "µs"; Rust's Duration Debug (what the
          # wasm_bench example uses) prints "µs" too, but "us" is accepted either way.
          UNITS = {"ns": 1, "us": 1_000, "µs": 1_000, "ms": 1_000_000, "s": 1_000_000_000}


          def parse_criterion(content):
              """cargo bench (criterion) — the native legs.

              encode/rgb/64x64        time:   [101.10 us 101.13 us 101.16 us]
                                                          ^^^^^^ the median
              """
              pattern = r"(\S+)\s+time:\s+\[[\d.]+ \S+ ([\d.]+) (\S+)"
              n = 0
              for m in re.finditer(pattern, content):
                  unit = m.group(3)
                  if unit not in UNITS:
                      continue
                  results.append(
                      {"name": f"{arch}/{m.group(1)}", "unit": "ns", "value": float(m.group(2)) * UNITS[unit]}
                  )
                  n += 1
              return n


          def parse_wasm_bench(content):
              """examples/wasm_bench.rs — the wasm32 leg, which is not criterion.

              === 64x64 (4096 pixels) ===
              Encode: 254.806us/iter, 16.07 MP/s, avg size: 687 bytes
              Decode: 84.963us/iter, 48.21 MP/s

              Named `<arch>/encode/<WxH>` to match the criterion legs' `encode/rgb/<WxH>`.
              """
              size = None
              n = 0
              for line in content.splitlines():
                  header = re.match(r"^===\s*(\S+)\s*\(", line)
                  if header:
                      size = header.group(1)
                      continue
                  m = re.match(r"^(Encode|Decode):\s*([\d.]+)(\S+?)/iter", line)
                  if m and size:
                      unit = m.group(3)
                      if unit not in UNITS:
                          continue
                      results.append(
                          {
                              "name": f"{arch}/{m.group(1).lower()}/{size}",
                              "unit": "ns",
                              "value": float(m.group(2)) * UNITS[unit],
                          }
                      )
                      n += 1
              return n


          if os.path.exists("bench_output.txt"):
              with open("bench_output.txt", "r") as f:
                  content = f.read()
              c = parse_criterion(content)
              w = parse_wasm_bench(content)
              print(f"criterion lines: {c}, wasm_bench lines: {w}")

          os.makedirs("benchmark-results", exist_ok=True)
          with open("benchmark-results/results.json", "w") as f:
              json.dump(results, f, indent=2)

          # An empty file makes github-action-benchmark fail with a confusing
          # "No benchmark result was found"; say why here instead.
          if not results:
              raise SystemExit(
                  f"::error::parsed 0 benchmark results for {arch} from bench_output.txt. "
                  "The benchmark output format changed and the parser above no longer matches it."
              )

          print(f"Parsed {len(results)} benchmark results for {arch}")
          PYEOF
          cat benchmark-results/results.json

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark-results/results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # This repo has no `gh-pages` branch. Without one the action fails
          # twice over: it fetches that branch before doing anything
          # ("fatal: couldn't find remote ref gh-pages"), and `skip-fetch-gh-pages`
          # alone is not enough because it then runs `git switch gh-pages`
          # ("fatal: invalid reference: gh-pages"). Both were measured on
          # 2026-08-29. `external-data-json-path` is the documented way out: with
          # it set, the action stores results in a file and does not use a git
          # branch at all.
          #
          # HONEST LIMITATION: this stops the failure, it does not restore
          # regression tracking. The data file lives only for the life of the
          # job, so the alert-threshold below has no history to compare against.
          # `auto-push` is dead config too -- this workflow is
          # workflow_dispatch-only, so `github.event_name == 'push'` is never
          # true. Real tracking needs somewhere durable for this file (a
          # gh-pages branch, or actions/cache) AND a push trigger; both are
          # owner decisions, so this change does not make them. The per-arch
          # results are still kept by "Upload benchmark artifacts" below.
          external-data-json-path: benchmark-results/history.json
          alert-threshold: '115%'
          comment-on-alert: true
          fail-on-alert: false
          max-items-in-chart: 100
          # Separate benchmark data per architecture
          benchmark-data-dir-path: dev/bench/${{ matrix.arch }}

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ matrix.arch }}
          path: |
            bench_output.txt
            benchmark-results/

  benchmark-summary:
    name: Benchmark Summary
    needs: benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: benchmark-*
          merge-multiple: false

      - name: Generate cross-platform comparison
        run: |
          echo "## Cross-Platform Benchmark Results" > summary.md
          echo "" >> summary.md

          for dir in benchmark-*/; do
            arch=$(basename "$dir" | sed 's/benchmark-//')
            echo "### $arch" >> summary.md
            echo '```' >> summary.md
            if [ -f "$dir/bench_output.txt" ]; then
              grep -E "time:" "$dir/bench_output.txt" | head -20 >> summary.md || echo "No results" >> summary.md
            else
              echo "No benchmark data" >> summary.md
            fi
            echo '```' >> summary.md
            echo "" >> summary.md
          done

          cat summary.md

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('summary.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Cross-Platform Benchmark')
            );

            const body = report + '\n\n*Updated: ' + new Date().toISOString() + '*';

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
