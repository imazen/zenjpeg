[package]
name = "jpegli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Improved JPEG encoder/decoder - Rust port of jpegli"
keywords = ["jpeg", "image", "encoder", "decoder", "compression"]
categories = ["multimedia::images", "encoding"]

[dependencies]
wide = { workspace = true }
bytemuck = { workspace = true }
arrayref = { workspace = true }
rgb = { workspace = true }
imgref = { workspace = true }
multiversion = { workspace = true }
lcms2 = { workspace = true, optional = true }
moxcms = { workspace = true, optional = true }
jpeg-decoder = { workspace = true, optional = true }
butteraugli = { workspace = true }

[dev-dependencies]
chrono = "0.4"
approx = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
test-case = { workspace = true }
png = { workspace = true }
dssim = { workspace = true }
ssimulacra2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
zune-jpeg = { workspace = true }
mozjpeg = { workspace = true }
jpeg-decoder = { workspace = true }

# For FFI comparison testing
jpegli-sys = { path = "../jpegli-sys" }

# For corpus comparison
codec-eval = { workspace = true }

[features]
default = ["simd"]
simd = []
cms = ["cms-lcms2"]  # Default CMS backend
cms-lcms2 = ["dep:lcms2", "dep:jpeg-decoder"]
cms-moxcms = ["dep:moxcms", "dep:jpeg-decoder"]
# Enable debug token serialization for C++ comparison
debug-tokens = []
# Enable test utilities (image generation, quality verification)
test-utils = []

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "decode"
harness = false

[lints]
workspace = true
